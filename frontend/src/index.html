<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Foyer, la maison ensemble</title>
  <!-- Relative base href so a single build works at the root or behind a reverse-proxy sub-path. -->
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Foyer, application de gestion familiale : calendrier, courses, tâches, budget, repas et plus.">
  <meta name="theme-color" content="#E56B4E">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Web app installable : c'est la condition des rappels sur iPhone (voir docs/taches.md). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Foyer">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Anti-flash du thème : pose la classe `dark` et la couleur de la barre d'état
       AVANT qu'Angular démarre, depuis la préférence d'appareil (localStorage).
       Trois lignes, aucune logique métier : le store reprend ensuite la main. -->
  <script>
    try {
      var t = localStorage.getItem('foyer.pref.theme') || 'systeme';
      var dark = t === 'sombre' || (t !== 'clair' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', dark ? '#15191E' : '#E56B4E');
    } catch (e) { /* mode privé ou pas de localStorage : le store posera le thème */ }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
