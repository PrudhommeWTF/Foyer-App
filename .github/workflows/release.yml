name: Release

# Publie une release GitHub à chaque tag de version poussé (vX.Y.Z, ou
# vX.Y.Z-rc.N pour une préversion). Mode d'emploi : docs/RELEASES.md.
#
# Ordre, chaque étape bloquant la suivante : contrôle du tag, mêmes contrôles
# que la CI, puis en parallèle le build et l'essai de fumée des archives par
# architecture et ceux de l'image Docker multi-architecture, enfin publication.
# Un échec où que ce soit = aucune release, et aucune étiquette d'image : l'image
# n'est poussée que par son empreinte (invisible sans elle), et ne reçoit ses
# étiquettes (1.4.0, latest…) qu'une fois tout le reste réussi.
on:
  push:
    tags: ['v*']

# Lecture seule partout ; seul le job de publication reçoit contents: write, et
# seuls les deux jobs de l'image reçoivent packages: write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NG_CLI_ANALYTICS: "false"
  # Nom de l'image en minuscules (GHCR l'exige) : ghcr.io/prudhommewtf/foyer-app
  # pour ce dépôt, celui du propriétaire pour un fork.
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  tag:
    name: Contrôle du tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      epoch: ${{ steps.epoch.outputs.epoch }}
    steps:
      # Historique complet : il faut tous les tags (ordre des versions) et main
      # (le commit tagué doit en faire partie).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Format, ordre et appartenance à main
        id: check
        run: scripts/release/check-tag.sh "$GITHUB_REF_NAME"

      # Date du commit, pour des archives reproductibles (le conteneur de build
      # n'a pas à relire l'historique Git).
      - name: Date du commit
        id: epoch
        run: echo "epoch=$(git log -1 --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

  checks:
    name: Contrôles (comme la CI)
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Recherche de secrets
        run: node scripts/cherche-secrets.js

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Audit des dépendances (backend)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Lint code mort (backend)
        working-directory: backend
        run: npm run typecheck

      - name: Audit des dépendances (frontend)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Typage des tests (frontend)
        working-directory: frontend
        run: npm run typecheck

      - name: Lint code mort (frontend)
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noUnusedLocals --noUnusedParameters --noEmit

  build:
    name: Build ${{ matrix.arch }}
    needs: [tag, checks]
    # Runners natifs, construction dans Debian 13 : better-sqlite3 est un module
    # natif, chaque archive se construit sur l'architecture qu'elle vise.
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 30
    steps:
      - name: Outils système
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl file git xz-utils python3 make g++

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Empaquetage
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          ARCH: ${{ matrix.arch }}
          SOURCE_DATE_EPOCH: ${{ needs.tag.outputs.epoch }}
        run: scripts/release/package.sh "$VERSION" "$ARCH" dist-release

      - name: Essai de fumée
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: scripts/release/smoke.sh "dist-release/foyer-app-linux-${ARCH}.tar.gz" "$VERSION" "$ARCH"

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.arch }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  image:
    name: Image Docker
    needs: [tag, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      name: ${{ steps.name.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image
        id: name
        run: echo "name=ghcr.io/${IMAGE_OWNER,,}/foyer-app" >> "$GITHUB_OUTPUT"

      # Étiquettes : 1.4.0, 1.4, 1 et latest pour une stable ; 1.4.0-rc.1 et next
      # pour une préversion, jamais latest (ni la mineure, ni la majeure : un
      # « docker pull …:1.4 » ne doit pas tomber sur une préversion).
      - name: Étiquettes et labels OCI
        id: meta
        uses: docker/metadata-action@v5
        env:
          # Annotations aussi au niveau de l'index multi-architecture : c'est là
          # que la page du package GHCR lit sa description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.name.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.tag.outputs.prerelease != 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.tag.outputs.prerelease != 'true' }}
            type=raw,value=latest,enable=${{ needs.tag.outputs.prerelease != 'true' }}
            type=raw,value=next,enable=${{ needs.tag.outputs.prerelease == 'true' }}
          labels: |
            org.opencontainers.image.title=Foyer
            org.opencontainers.image.description=Foyer, application de gestion familiale auto-hébergée (agenda, tâches, courses, repas, finances).
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.tag.outputs.version }}
          annotations: |
            org.opencontainers.image.title=Foyer
            org.opencontainers.image.description=Foyer, application de gestion familiale auto-hébergée (agenda, tâches, courses, repas, finances).
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.tag.outputs.version }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # D'abord amd64 seul, chargé dans le démon local pour l'essai de fumée.
      # Le cache GitHub Actions (même portée que le push ci-dessous) évite de
      # tout recompiler, en particulier better-sqlite3 en arm64 sous QEMU.
      - name: Build amd64 pour l'essai
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: foyer-app:smoke
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FOYER_VERSION=${{ needs.tag.outputs.version }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      - name: Essai de fumée de l'image
        run: scripts/release/smoke-image.sh foyer-app:smoke "${{ needs.tag.outputs.version }}" linux/amd64

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Poussée par empreinte seulement, sans étiquette : si une autre étape du
      # workflow échoue, rien n'est visible sous 1.4.0 ni latest (il reste une
      # version non étiquetée dans le package, voir docs/RELEASES.md). L'amd64
      # sort du cache de l'étape d'essai : c'est la même image.
      - name: Build multi-architecture et poussée par empreinte
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: FOYER_VERSION=${{ needs.tag.outputs.version }}
          outputs: type=image,name=${{ steps.name.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      - name: Contrôle de l'index poussé
        env:
          REF: ${{ steps.name.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$REF"
          platforms="$(docker buildx imagetools inspect "$REF" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
          for p in linux/amd64 linux/arm64; do
            [[ " $platforms " == *" $p "* ]] || { echo "::error::plateforme $p absente de l'index ($platforms)"; exit 1; }
          done

  image-tags:
    name: Étiquettes de l'image
    needs: [tag, build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Les étiquettes pointent sur l'index déjà poussé et essayé : aucun
      # rebuild, la même empreinte sous chaque nom.
      - name: Pose des étiquettes
        env:
          REF: ${{ needs.image.outputs.name }}@${{ needs.image.outputs.digest }}
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          args=()
          while read -r t; do [[ -n "$t" ]] && args+=(-t "$t"); done <<< "$TAGS"
          (( ${#args[@]} )) || { echo "::error::aucune étiquette calculée"; exit 1; }
          docker buildx imagetools create "${args[@]}" "$REF"
          while read -r t; do
            [[ -n "$t" ]] || continue
            got="$(docker buildx imagetools inspect "$t" --format '{{.Manifest.Digest}}')"
            [[ "$got" == "${{ needs.image.outputs.digest }}" ]] || { echo "::error::$t pointe sur $got"; exit 1; }
            echo "$t -> $got"
          done <<< "$TAGS"

  publish:
    name: Publication
    needs: [tag, build, image, image-tags]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true

      - name: Vérification des empreintes
        working-directory: dist-release
        run: |
          for arch in x86_64 arm64; do
            for f in "foyer-app-linux-${arch}.tar.gz" "foyer-app-linux-${arch}.tar.gz.sha256"; do
              [ -f "$f" ] || { echo "::error::$f manquant"; exit 1; }
            done
          done
          sha256sum -c ./*.sha256

      # Une release créée à la main depuis la page GitHub ne fait pas échouer le
      # workflow : elle reçoit les fichiers et est publiée. Une préversion n'est
      # jamais marquée « latest » (les foyers du canal stable ne doivent pas la
      # voir arriver).
      - name: Publication de la release
        working-directory: dist-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.tag.outputs.version }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
          IMAGE: ${{ needs.image.outputs.name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            flags=(--prerelease --latest=false)
            moving=next
          else
            flags=(--prerelease=false --latest)
            moving=latest
          fi
          notes="$(printf '%s\n' \
            '## Image Docker' \
            '' \
            '```bash' \
            "docker pull ${IMAGE}:${VERSION}" \
            '```' \
            '' \
            "Plateformes \`linux/amd64\` et \`linux/arm64\`, aussi étiquetée \`${moving}\`. Empreinte de l'index :" \
            '' \
            '```' \
            "${IMAGE}@${DIGEST}" \
            '```')"
          files=(./*.tar.gz ./*.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existante : téléversement des fichiers et publication."
            gh release upload "$TAG" "${files[@]}" --clobber
            body="$(gh release view "$TAG" --json body --jq .body)"
            [[ "$body" == *"$DIGEST"* ]] || body="$(printf '%s\n\n%s\n' "$notes" "$body")"
            gh release edit "$TAG" --draft=false "${flags[@]}" --notes "$body"
          else
            # --notes est placé avant les notes générées.
            gh release create "$TAG" --verify-tag --generate-notes --notes "$notes" "${flags[@]}" "${files[@]}"
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets \
            --jq '"\(.url) brouillon=\(.isDraft) préversion=\(.isPrerelease) fichiers=\([.assets[].name] | join(", "))"'
