name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  NG_CLI_ANALYTICS: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Un secret arrivé dans l'historique Git est compromis même retiré ensuite :
      # le seul moment où l'attraper est avant qu'il n'y entre. Bloquant.
      - name: Recherche de secrets
        run: node scripts/cherche-secrets.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Les dépendances de production, et elles seules : un outil de build
      # vulnérable ne tourne pas sur la machine du foyer. Bloquant à partir de
      # « high » : « moderate » ferait échouer la CI sur des avis qui n'ont
      # souvent aucun chemin d'exploitation ici, et une CI rouge en permanence ne
      # se lit plus.
      - name: Audit des dépendances (backend)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      # Le module Finances porte la logique la plus coûteuse en cas de bug
      # (déduplication, agrégats, migrations) : ses tests bloquent la CI.
      - name: Test backend
        working-directory: backend
        run: npm test

      # « Pas de code mort » : imports, variables et paramètres inutilisés échouent.
      - name: Lint code mort (backend)
        working-directory: backend
        run: npm run typecheck

      - name: Audit des dépendances (frontend)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Analyse des lignes d'ingrédients, agrégation, conversion d'unités, dates :
      # une erreur y est silencieuse (elle fait acheter trois kilos de farine,
      # elle ne plante pas). Ces tests bloquent la CI.
      - name: Test frontend
        working-directory: frontend
        run: npm test

      # Les tests sont hors de tsconfig.app.json : sans cette passe, un test peut
      # rester vert en changeant de sens, un argument mal typé valant « absent ».
      - name: Typage des tests (frontend)
        working-directory: frontend
        run: npm run typecheck

      - name: Lint code mort (frontend)
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noUnusedLocals --noUnusedParameters --noEmit
